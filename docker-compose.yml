services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medtrack-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medtrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: medtrack-cron
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Kolkata}
